<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" font-family="Aptos, 'Segoe UI', 'Liberation Sans', Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker></defs><rect x="0" y="0" width="1200" height="560" fill="#ffffff"/><text x="600" y="34" font-size="21" font-weight="bold" text-anchor="middle" fill="#000000" style="">Attacker Path: From Port Discovery to the Staged Escalation</text><rect x="70" y="70" width="300" height="96" rx="7" ry="7" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="220.0" y="92" font-size="14" font-weight="bold" text-anchor="middle" fill="#000000" style="">1. Discover</text><text x="220.0" y="118" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#000000" style="">Port scan finds TCP 22 open;</text><text x="220.0" y="138" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#000000" style="">banner reads as Ubuntu OpenSSH</text><rect x="385" y="70" width="300" height="96" rx="7" ry="7" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="535.0" y="92" font-size="14" font-weight="bold" text-anchor="middle" fill="#000000" style="">2. Enter</text><text x="535.0" y="118" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#000000" style="">Guess or reuse a password for</text><text x="535.0" y="138" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#000000" style="">a listed account (for example support)</text><rect x="700" y="70" width="300" height="96" rx="7" ry="7" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="850.0" y="92" font-size="14" font-weight="bold" text-anchor="middle" fill="#000000" style="">3. Look around</text><text x="850.0" y="118" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#000000" style="">Recon commands answered from</text><text x="850.0" y="138" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#000000" style="">the stored Ubuntu image</text><rect x="70" y="230" width="300" height="96" rx="7" ry="7" fill="#f6ece9" stroke="#333333" stroke-width="1.5"/><text x="220.0" y="252" font-size="14" font-weight="bold" text-anchor="middle" fill="#000000" style="">4. Find the grant</text><text x="220.0" y="278" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#000000" style="">sudo -l reveals a sudo rule:</text><text x="220.0" y="298" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#000000" style="">run find as vaultsvc on one path</text><rect x="385" y="230" width="300" height="96" rx="7" ry="7" fill="#f6ece9" stroke="#333333" stroke-width="1.5"/><text x="535.0" y="252" font-size="14" font-weight="bold" text-anchor="middle" fill="#000000" style="">5. Abuse the grant</text><text x="535.0" y="278" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#000000" style="">find -exec runs as vaultsvc and</text><text x="535.0" y="298" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#000000" style="">reads a file support cannot read</text><rect x="700" y="230" width="300" height="96" rx="7" ry="7" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="850.0" y="252" font-size="14" font-weight="bold" text-anchor="middle" fill="#000000" style="">6. All recorded</text><text x="850.0" y="278" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#000000" style="">Each step logged with time,</text><text x="850.0" y="298" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#000000" style="">source IP, account and command</text><line x1="370" y1="118" x2="384" y2="118" stroke="#333333" stroke-width="1.6" marker-end="url(#a)"/><line x1="685" y1="118" x2="699" y2="118" stroke="#333333" stroke-width="1.6" marker-end="url(#a)"/><line x1="850" y1="166" x2="850" y2="228" stroke="#333333" stroke-width="1.6" marker-end="url(#a)"/><text x="905" y="200" font-size="11" font-weight="normal" text-anchor="middle" fill="#000000" style="">same session</text><line x1="370" y1="278" x2="384" y2="278" stroke="#333333" stroke-width="1.6" marker-end="url(#a)"/><line x1="685" y1="278" x2="699" y2="278" stroke="#333333" stroke-width="1.6" marker-end="url(#a)"/><rect x="70" y="366" width="1060" height="70" rx="7" ry="7" fill="#e7edf4" stroke="#333333" stroke-width="1.5"/><text x="600.0" y="397.125" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#000000" style="">The weak sudo rule and the file it exposes are bait. Discovery is intended: the honeypot is placed</text><text x="600.0" y="413.625" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#000000" style="">on port 22 to be found. What the operator gains is the full record of how the intruder escalated.</text><rect x="70" y="456" width="1060" height="68" rx="7" ry="7" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="600.0" y="486.125" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#000000" style="">Commands observed in the decoy path (support account):</text><text x="600.0" y="502.625" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#000000" style="">sudo -l    then    sudo -u vaultsvc /usr/bin/find /var/backups/portal-review -maxdepth 1</text></svg>