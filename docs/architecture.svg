<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" font-family="Aptos, 'Segoe UI', 'Liberation Sans', Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker></defs><rect x="0" y="0" width="1200" height="820" fill="#ffffff"/><text x="600" y="34" font-size="22" font-weight="bold" text-anchor="middle" fill="#000000" style="">LLM SSH Honeypot - Program Architecture</text><rect x="30" y="52" width="1140" height="78" rx="9" ry="9" fill="#f1f3f5" stroke="#ccd2d9" stroke-width="1.2"/><text x="44" y="72" font-size="13" font-weight="bold" text-anchor="start" fill="#000000" style="">1. Operator setup</text><rect x="250" y="72" width="360" height="42" rx="7" ry="7" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="430.0" y="97.725" font-size="13.5" font-weight="normal" text-anchor="middle" fill="#000000" style="">run.py and the control window (GUI)</text><rect x="660" y="72" width="480" height="42" rx="7" ry="7" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="900.0" y="97.725" font-size="13.5" font-weight="normal" text-anchor="middle" fill="#000000" style="">Model choice: local Ollama, or hosted API with a key</text><rect x="30" y="146" width="1140" height="86" rx="9" ry="9" fill="#f1f3f5" stroke="#ccd2d9" stroke-width="1.2"/><text x="44" y="166" font-size="13" font-weight="bold" text-anchor="start" fill="#000000" style="">2. Network entry</text><rect x="250" y="168" width="180" height="46" rx="7" ry="7" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="340.0" y="187.125" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#000000" style="">Attacker</text><text x="340.0" y="203.625" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#000000" style="">and port scan</text><rect x="460" y="168" width="360" height="46" rx="7" ry="7" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="640.0" y="187.125" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#000000" style="">SSH listener 0.0.0.0:22 (2222 fallback)</text><text x="640.0" y="203.625" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#000000" style="">Ubuntu OpenSSH banner</text><rect x="850" y="168" width="290" height="46" rx="7" ry="7" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="995.0" y="187.2" font-size="12" font-weight="normal" text-anchor="middle" fill="#000000" style="">Password check against the</text><text x="995.0" y="203.2" font-size="12" font-weight="normal" text-anchor="middle" fill="#000000" style="">PBKDF2 store: ubuntu, deploy, support</text><line x1="430" y1="191" x2="458" y2="191" stroke="#333333" stroke-width="1.6" marker-end="url(#a)"/><line x1="820" y1="191" x2="848" y2="191" stroke="#333333" stroke-width="1.6" marker-end="url(#a)"/><rect x="30" y="248" width="1140" height="208" rx="9" ry="9" fill="#f1f3f5" stroke="#ccd2d9" stroke-width="1.2"/><text x="44" y="268" font-size="13" font-weight="bold" text-anchor="start" fill="#000000" style="">3. Per-command engine</text><rect x="360" y="268" width="480" height="44" rx="7" ry="7" fill="#e7edf4" stroke="#333333" stroke-width="1.5"/><text x="600.0" y="294.55" font-size="13" font-weight="bold" text-anchor="middle" fill="#000000" style="">Session controller: PTY shell, parses and routes each command</text><rect x="45" y="356" width="255" height="86" rx="7" ry="7" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="172.5" y="395.125" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#000000" style="">Bash builtins,</text><text x="172.5" y="411.625" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#000000" style="">pipes, redirection</text><line x1="600" y1="312" x2="172" y2="354" stroke="#333333" stroke-width="1.6" marker-end="url(#a)"/><rect x="330" y="356" width="255" height="86" rx="7" ry="7" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="457.5" y="395.125" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#000000" style="">Native handlers: files, recon,</text><text x="457.5" y="411.625" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#000000" style="">processes, accounts, network, curl</text><line x1="600" y1="312" x2="457" y2="354" stroke="#333333" stroke-width="1.6" marker-end="url(#a)"/><rect x="615" y="356" width="255" height="86" rx="7" ry="7" fill="#f6ece9" stroke="#333333" stroke-width="1.5"/><text x="742.5" y="386.875" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#000000" style="">Privilege runtime:</text><text x="742.5" y="403.375" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#000000" style="">staged sudo decoy</text><text x="742.5" y="419.875" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#000000" style="">(support to vaultsvc)</text><line x1="600" y1="312" x2="742" y2="354" stroke="#333333" stroke-width="1.6" marker-end="url(#a)"/><rect x="900" y="356" width="255" height="86" rx="7" ry="7" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="1027.5" y="395.125" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#000000" style="">Model generation:</text><text x="1027.5" y="411.625" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#000000" style="">grounded terminal output</text><line x1="600" y1="312" x2="1027" y2="354" stroke="#333333" stroke-width="1.6" marker-end="url(#a)"/><rect x="30" y="472" width="1140" height="150" rx="9" ry="9" fill="#f1f3f5" stroke="#ccd2d9" stroke-width="1.2"/><text x="44" y="492" font-size="13" font-weight="bold" text-anchor="start" fill="#000000" style="">4. Stored state and model backend</text><line x1="595" y1="492" x2="595" y2="612" stroke="#ccd2d9" stroke-width="1.2" stroke-dasharray="4 4"/><text x="310" y="508" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#000000" style="">Stored system state</text><text x="880" y="508" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#000000" style="">Model backend</text><rect x="45" y="518" width="255" height="42" rx="7" ry="7" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="172.5" y="543.375" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#000000" style="">fs.sqlite: Ubuntu image</text><rect x="45" y="568" width="255" height="42" rx="7" ry="7" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="172.5" y="593.375" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#000000" style="">Per-IP overlays (realms)</text><rect x="315" y="518" width="255" height="42" rx="7" ry="7" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="442.5" y="543.375" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#000000" style="">Profiles: persona + decoy</text><rect x="315" y="568" width="255" height="42" rx="7" ry="7" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="442.5" y="593.375" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#000000" style="">Retrieval: reference captures</text><rect x="620" y="518" width="520" height="42" rx="7" ry="7" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="880.0" y="543.375" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#000000" style="">Local model via Ollama (drives the native handlers)</text><rect x="620" y="568" width="520" height="42" rx="7" ry="7" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="880.0" y="593.375" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#000000" style="">Hosted API: OpenAI or Anthropic (key)</text><line x1="600" y1="444" x2="600" y2="470" stroke="#333333" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#a)"/><text x="600.0" y="462" font-size="11" font-weight="normal" text-anchor="middle" fill="#000000" style="">handlers read the stored state and call the model</text><rect x="30" y="638" width="1140" height="86" rx="9" ry="9" fill="#f1f3f5" stroke="#ccd2d9" stroke-width="1.2"/><text x="44" y="658" font-size="13" font-weight="bold" text-anchor="start" fill="#000000" style="">5. Capture (every connection and command)</text><rect x="45" y="660" width="360" height="46" rx="7" ry="7" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="225.0" y="679.2" font-size="12" font-weight="normal" text-anchor="middle" fill="#000000" style="">logs/commands.log</text><text x="225.0" y="695.2" font-size="12" font-weight="normal" text-anchor="middle" fill="#000000" style="">one readable line per command</text><rect x="430" y="660" width="330" height="46" rx="7" ry="7" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="595.0" y="679.2" font-size="12" font-weight="normal" text-anchor="middle" fill="#000000" style="">logs/sessions/&lt;id&gt;.log</text><text x="595.0" y="695.2" font-size="12" font-weight="normal" text-anchor="middle" fill="#000000" style="">full per-connection transcript</text><rect x="785" y="660" width="355" height="46" rx="7" ry="7" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="962.5" y="679.2" font-size="12" font-weight="normal" text-anchor="middle" fill="#000000" style="">logs/events.jsonl</text><text x="962.5" y="695.2" font-size="12" font-weight="normal" text-anchor="middle" fill="#000000" style="">structured record with timing</text><rect x="30" y="740" width="1140" height="54" rx="7" ry="7" fill="#f1f3f5" stroke="#333333" stroke-width="1.5"/><text x="600.0" y="763.125" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#000000" style="">Containment: attacker input never runs on the host, it is bytes in SQLite.</text><text x="600.0" y="779.625" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#000000" style="">Outbound is limited to public addresses and never the host's own.</text></svg>